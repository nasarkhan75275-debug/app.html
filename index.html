<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NASAR_GLOBE_PRO</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--green:#00ff88;--border:#222;--card:#111}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#e8e8e8;font-family:monospace;height:100vh;display:flex;flex-direction:column}
header{border-bottom:1px solid var(--border);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;background:#000;z-index:1000}
.btn{background:#111;border:1px solid var(--border);color:#e8e8e8;padding:6px 10px;font-size:11px;cursor:pointer}
.btn:hover{border-color:var(--green)} .btn-green{background:#e8e8e8;color:#000;font-weight:700}
#map{flex:1;width:100%;background:#000}
#info{position:absolute;top:52px;left:8px;background:rgba(0,0,0,0.9);color:var(--green);padding:8px 10px;font-size:11px;border:1px solid var(--border);z-index:1000;min-width:180px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);display:none;justify-content:center;align-items:center;z-index:2000;padding:12px}
.modal.open{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);padding:18px;width:100%;max-width:380px}
input{width:100%;background:#000;border:1px solid var(--border);color:#e8e8e8;padding:10px;margin:6px 0;font-family:inherit;font-size:12px;outline:none}
input:focus{border-color:var(--green)}
.history-item{padding:8px;border:1px solid var(--border);margin:6px 0;display:flex;justify-content:space-between;background:#000;font-size:11px}
.danger{color:#ff4444;border-color:#ff4444}
.leaflet-control-attribution{background:#000 !important;color:#888 !important;font-size:9px !important}
</style>
</head>
<body>
<header>
  <div><span style="color:var(--green)">*</span> NASAR_GLOBE_3D_PRO</div>
  <div style="display:flex;gap:6px">
    <button class="btn" onclick="openModal('historyModal')">📜 HISTORY</button>
    <button class="btn" onclick="openModal('accountModal')" id="accBtn">👤 ACCOUNT</button>
  </div>
</header>

<div id="info">🛰️ LIVE SATELLITE - ESRI + NASA<br><span id="userLabel">Guest</span> | <span id="coords">25.59, 85.13</span><br>
<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
<button class="btn" onclick="flyToPatna()">📍 Patna</button>
<button class="btn" onclick="flyToBuxar()">🏠 Buxar</button>
<button class="btn" onclick="toggleLayer()">🛰️ NASA/ESRI</button>
<button class="btn" onclick="saveHistory('Manual Save')">+ Save</button>
</div>
</div>

<div id="map"></div>

<div class="modal" id="accountModal">
  <div class="modal-box">
    <h2 style="color:var(--green);font-size:13px;margin-bottom:14px">ACCOUNT_</h2>
    <div id="authForm">
      <input id="email" placeholder="email: nasar@patna.com">
      <input id="pass" type="password" placeholder="password">
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn btn-green" style="flex:1" onclick="signUp()">SIGN UP</button>
        <button class="btn" style="flex:1" onclick="signIn()">SIGN IN</button>
      </div>
    </div>
    <div id="userPanel" style="display:none">
      <p style="font-size:12px">Logged: <span id="currentEmail" style="color:var(--green)"></span></p>
      <p style="font-size:10px;color:#888">Created: <span id="accDate"></span></p>
      <button class="btn" style="width:100%;margin-top:12px" onclick="signOut()">SIGN OUT</button>
      <button class="btn danger" style="width:100%;margin-top:8px" onclick="deleteAccount()">🗑️ DELETE ACCOUNT</button>
    </div>
    <button class="btn" style="width:100%;margin-top:12px" onclick="closeModal('accountModal')">CLOSE</button>
  </div>
</div>

<div class="modal" id="historyModal">
  <div class="modal-box" style="max-width:500px;max-height:80vh;overflow-y:auto">
    <h2 style="color:var(--green)">HISTORY_ <span style="color:#888;font-size:10px" id="historyCount">0</span></h2>
    <div id="historyList"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn danger" style="flex:1" onclick="clearHistory()">🗑️ CLEAR ALL</button>
      <button class="btn" style="flex:1" onclick="closeModal('historyModal')">CLOSE</button>
    </div>
  </div>
</div>

<script>
// ACCOUNT + HISTORY
let currentUser = JSON.parse(localStorage.getItem('nasar_current_user') || 'null');
let users = JSON.parse(localStorage.getItem('nasar_users') || '[]');
let historyData = JSON.parse(localStorage.getItem('nasar_history') || '[]');
function saveAll(){localStorage.setItem('nasar_users',JSON.stringify(users));localStorage.setItem('nasar_current_user',JSON.stringify(currentUser));localStorage.setItem('nasar_history',JSON.stringify(historyData));}
function signUp(){let e=email.value.trim(),p=pass.value.trim();if(!e||!p)return alert('email+pass likho');if(users.find(u=>u.email===e))return alert('exists, sign in karo');let u={email:e,pass:p,created:new Date().toLocaleString(),id:Date.now()};users.push(u);currentUser=u;saveAll();updateUI();alert('Account ban gaya!');}
function signIn(){let e=email.value.trim(),p=pass.value.trim();let u=users.find(u=>u.email===e&&u.pass===p);if(!u)return alert('galat');currentUser=u;saveAll();updateUI();}
function signOut(){currentUser=null;saveAll();updateUI();}
function deleteAccount(){if(!currentUser)return;if(!confirm('Pakka delete?'))return;users=users.filter(u=>u.id!==currentUser.id);historyData=historyData.filter(h=>h.userId!==currentUser.id);currentUser=null;saveAll();updateUI();closeModal('accountModal');}
function updateUI(){let l=!!currentUser;authForm.style.display=l?'none':'block';userPanel.style.display=l?'block':'none';userLabel.textContent=l?currentUser.email:'Guest';accBtn.textContent=l?'👤 '+currentUser.email.split('@')[0]:'👤 ACCOUNT';if(l){currentEmail.textContent=currentUser.email;accDate.textContent=currentUser.created;}renderHistory();}
function saveHistory(a){let h={id:Date.now(),action:a,time:new Date().toLocaleString(),userId:currentUser?currentUser.id:'guest'};historyData.unshift(h);if(historyData.length>100)historyData.pop();saveAll();renderHistory();}
function renderHistory(){let f=currentUser?historyData.filter(h=>h.userId===currentUser.id||h.userId==='guest'):historyData.filter(h=>h.userId==='guest');historyCount.textContent=f.length+' items';historyList.innerHTML=f.length?f.map(h=>`<div class="history-item"><div><b>${h.action}</b><br><span style="color:#888">${h.time}</span></div><button class="btn danger" onclick="deleteOne(${h.id})">DEL</button></div>`).join(''):'<p style="color:#888;font-size:11px">No history</p>';}
function deleteOne(id){historyData=historyData.filter(h=>h.id!==id);saveAll();renderHistory();}
function clearHistory(){if(!confirm('Clear all?'))return;historyData=currentUser?historyData.filter(h=>h.userId!==currentUser.id):historyData.filter(h=>h.userId!=='guest');saveAll();renderHistory();}
function openModal(id){document.getElementById(id).classList.add('open');if(id==='historyModal')renderHistory();}
function closeModal(id){document.getElementById(id).classList.remove('open');}

// MAP - FIXED, 100% WORKS ON MOBILE
const map = L.map('map',{zoomControl:false}).setView([25.5941, 85.1376], 6);

const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, attribution:'Esri'}).addTo(map);
const nasaLayer = L.tileLayer('https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/2024-05-08/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg', {maxZoom:9, attribution:'NASA GIBS'});
let isNasa=false;

function toggleLayer(){
  if(isNasa){map.removeLayer(nasaLayer);map.addLayer(esriSat);isNasa=false;saveHistory('Switched to ESRI Satellite');}
  else{map.removeLayer(esriSat);map.addLayer(nasaLayer);isNasa=true;saveHistory('Switched to NASA TrueColor');}
}
function flyToPatna(){map.flyTo([25.5941, 85.1376], 15);L.marker([25.5941, 85.1376]).addTo(map).bindPopup('Patna HQ - NASAR').openPopup();saveHistory('Fly to Patna');}
function flyToBuxar(){map.flyTo([25.5647, 83.9751], 15);L.marker([25.5647, 83.9751]).addTo(map).bindPopup('Buxar - Home').openPopup();saveHistory('Fly to Buxar');}

map.on('move',()=>{let c=map.getCenter();coords.textContent=c.lat.toFixed(4)+', '+c.lng.toFixed(4);});

updateUI();
saveHistory('App Opened v3 - Fixed');
setTimeout(flyToPatna,1000);
</script>
</body>
</html>
